version: 2

project_name: docker-trim

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/mkamranr/docker-trim/internal/version.version={{.Version}}
      - -X github.com/mkamranr/docker-trim/internal/version.commit={{.ShortCommit}}
      - -X github.com/mkamranr/docker-trim/internal/version.date={{.Date}}

archives:
  - name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - CHANGELOG.md
      - LICENSE-MIT
      - LICENSE-APACHE

checksum:
  name_template: SHA256SUMS

changelog:
  use: github-native

release:
  github:
    owner: mkamranr
    name: docker-trim
  draft: false
  # Re-running a release has to work. Without this, goreleaser refuses to
  # overwrite assets it already uploaded and the whole run fails with
  # "already_exists", which is exactly what happens when the first attempt was
  # missing a secret and you fix it and try again.
  mode: replace

brews:
  - name: docker-trim
    # Homebrew stopped discovering formulae at a tap's root, so without this
    # goreleaser writes a docker-trim.rb that `brew install` cannot see, and the
    # release looks like it worked.
    directory: Formula
    repository:
      owner: mkamranr
      name: homebrew-tap
      token: "{{ .Env.TAP_TOKEN }}"
    commit_author:
      name: docker-trim release bot
      email: noreply@github.com
    commit_msg_template: "docker-trim {{ .Version }}"
    homepage: https://github.com/mkamranr/docker-trim
    description: Shrink container images and cut their attack surface
    license: "MIT OR Apache-2.0"
    test: |
      system "#{bin}/docker-trim", "--version"

dockers:
  - image_templates:
      - "ghcr.io/mkamranr/docker-trim:{{ .Tag }}-amd64"
      - "ghcr.io/mkamranr/docker-trim:latest-amd64"
    use: buildx
    goarch: amd64
    dockerfile: Dockerfile.goreleaser
    build_flag_templates:
      - "--platform=linux/amd64"
  - image_templates:
      - "ghcr.io/mkamranr/docker-trim:{{ .Tag }}-arm64"
      - "ghcr.io/mkamranr/docker-trim:latest-arm64"
    use: buildx
    goarch: arm64
    dockerfile: Dockerfile.goreleaser
    build_flag_templates:
      - "--platform=linux/arm64"

docker_manifests:
  - name_template: "ghcr.io/mkamranr/docker-trim:{{ .Tag }}"
    image_templates:
      - "ghcr.io/mkamranr/docker-trim:{{ .Tag }}-amd64"
      - "ghcr.io/mkamranr/docker-trim:{{ .Tag }}-arm64"
  - name_template: "ghcr.io/mkamranr/docker-trim:latest"
    image_templates:
      - "ghcr.io/mkamranr/docker-trim:latest-amd64"
      - "ghcr.io/mkamranr/docker-trim:latest-arm64"
