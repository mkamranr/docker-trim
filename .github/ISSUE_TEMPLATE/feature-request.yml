name: Feature request
description: Suggest something docker-trim should do
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that docker-trim makes hard or impossible?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Does it fit what docker-trim is?
      description: |
        docker-trim shrinks container images and reports their attack surface, and it never
        reports a size it did not measure. Tick what applies; leave a box unticked and say
        why in the box above if you think the rule should bend here.
      options:
        - label: It makes images smaller, or explains where their bytes went
        - label: It can be verified by building the result, not just asserted
        - label: It does not require docker-trim to guess at what a build produces
