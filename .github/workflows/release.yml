name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Re-releasing v0.1.0 during a repository restore rebuilt it as
      # project_name: dtrim and recreated the ghcr package that name had been
      # retired from. This refuses to publish anything that does not build as
      # docker-trim, and runs before the registry login so a bad ref fails
      # having pushed nothing.
      #
      # It cannot protect a re-pushed pre-0.8.0 tag: a tag push runs the
      # workflow stored at that tag, and those carry their own copy of this
      # file without this step. What it does cover is the workflow_dispatch
      # path, which runs this workflow while checking out the named tag --
      # which is how those tags get re-released in practice -- and every tag
      # cut from here on. Blocking the push path needs a tag ruleset, not a
      # workflow step.
      - name: Refuse to publish under a retired name
        run: |
          name=$(sed -n 's/^project_name:[[:space:]]*//p' .goreleaser.yaml | head -1)
          if [ "$name" != "docker-trim" ]; then
            echo "::error::this ref builds as '${name:-unset}', not docker-trim"
            echo "Publishing it would create release assets and a ghcr package under a retired name."
            exit 1
          fi
          echo "builds as $name"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A missing tap token should skip the Homebrew step, not fail the whole
      # release: the archives and the container image are the parts that matter.
      - name: Check for a Homebrew tap token
        id: tap
        run: |
          if [ -n "${{ secrets.TAP_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "TAP_TOKEN is not set, so the Homebrew formula will not be updated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: >-
            release --clean
            ${{ steps.tap.outputs.present == 'false' && '--skip=homebrew' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
