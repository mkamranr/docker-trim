name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      # v8 installs golangci-lint v2, which reads the v2 config in
      # .golangci.yml and is built against a Go new enough for this go.mod.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          # The integration tests are behind a build tag, so without this they
          # are never linted and only break once CI runs them.
          args: --build-tags integration

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff

  msrv:
    name: minimum supported Go version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go build ./...

  integration:
    name: integration (builds real images)
    runs-on: ubuntu-latest
    # Ubuntu runners ship a Docker daemon; the macOS and Windows ones do not,
    # which is why this job is not part of the matrix above.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: reduction bands
        run: DOCKER_TRIM_INTEGRATION=1 go test -tags integration -timeout 40m ./tests/... -v
      - name: docker-trim passes its own analysis
        # A real gate, not a smoke test: if docker-trim would fail this Dockerfile in
        # someone else's pipeline, it has to fail it here first. This is what
        # caught DT010 flagging the distroless nonroot tag.
        run: |
          go build -o docker-trim .
          ./docker-trim --analyze-only -f Dockerfile --fail-on high

      - name: docker trim survives docker's global flags
        # Docker forwards its own global flags to a plugin verbatim and ahead
        # of the plugin name. Getting that wrong broke `docker --debug trim`
        # outright, and the naive fix -- skipping the prefix -- would have made
        # `docker --context prod trim` report the default daemon's numbers
        # under the name of someone else's. Both halves are asserted here.
        run: |
          set -euo pipefail
          go build -o docker-trim .
          mkdir -p ~/.docker/cli-plugins
          ln -sf "$PWD/docker-trim" ~/.docker/cli-plugins/docker-trim

          for inv in "trim" "--debug trim" "-D trim" "--log-level warn trim" \
                     "--context default trim" "-c default trim"; do
            echo "docker $inv --version"
            docker $inv --version > /dev/null
          done

          # TLS cannot be forwarded faithfully, so it must refuse rather than
          # connect with credentials the user did not choose.
          if docker --tlsverify trim --version > /dev/null 2>&1; then
            echo "FAIL: --tlsverify should have been refused"; exit 1
          fi

          # And the one that matters: a context naming an unreachable daemon
          # has to fail *against that daemon*. Succeeding would prove the
          # context was silently discarded.
          docker pull -q alpine:3.20 > /dev/null
          docker tag alpine:3.20 routing-check:local
          docker trim --analyze-only --image routing-check:local --quiet > /dev/null
          docker context create broken --docker host=unix:///nonexistent/docker.sock > /dev/null

          if out=$(docker --context broken trim --analyze-only --image routing-check:local --quiet 2>&1); then
            echo "FAIL: --context was ignored; the broken context should not have succeeded"; exit 1
          fi
          case "$out" in
            *unix:///nonexistent/docker.sock*) echo "ok: --context routed to the daemon it names" ;;
            *) echo "FAIL: it failed, but not because it used the named daemon:"; echo "$out"; exit 1 ;;
          esac
