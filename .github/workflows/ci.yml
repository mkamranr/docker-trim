name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      # v8 installs golangci-lint v2, which reads the v2 config in
      # .golangci.yml and is built against a Go new enough for this go.mod.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          # The integration tests are behind a build tag, so without this they
          # are never linted and only break once CI runs them.
          args: --build-tags integration

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff

  msrv:
    name: minimum supported Go version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go build ./...

  integration:
    name: integration (builds real images)
    runs-on: ubuntu-latest
    # Ubuntu runners ship a Docker daemon; the macOS and Windows ones do not,
    # which is why this job is not part of the matrix above.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: reduction bands
        run: DOCKER_TRIM_INTEGRATION=1 go test -tags integration -timeout 40m ./tests/... -v
      - name: docker-trim passes its own analysis
        # A real gate, not a smoke test: if docker-trim would fail this Dockerfile in
        # someone else's pipeline, it has to fail it here first. This is what
        # caught DT010 flagging the distroless nonroot tag.
        run: |
          go build -o docker-trim .
          ./docker-trim --analyze-only -f Dockerfile --fail-on high
